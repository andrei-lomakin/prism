services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism
      POSTGRES_DB: prism
    ports:
      # Host 5434 — Windows often already has a native Postgres on 5432
      - "5434:5432"
    volumes:
      - prism_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # No host port: 6379 is already taken on this machine by another Redis.
    # api/worker talk to redis:6379 on the compose network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn prism.api.app:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://prism:prism@postgres:5432/prism
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      UPLOAD_DIR: /app/data/uploads
      BM25_DIR: /app/data/bm25
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./configs:/app/configs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: .
    command: arq prism.worker.settings.WorkerSettings
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://prism:prism@postgres:5432/prism
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      UPLOAD_DIR: /app/data/uploads
      BM25_DIR: /app/data/bm25
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./configs:/app/configs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional local LLM: docker compose --profile local-llm up
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - prism_ollama:/root/.ollama

  # Optional tracing UI: docker compose --profile obs up
  # Point OTEL_EXPORTER_ENDPOINT=http://phoenix:4317 and OTEL_ENABLED=true on api/worker.
  phoenix:
    profiles: ["obs"]
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_PORT: "6006"
      PHOENIX_GRPC_PORT: "4317"

volumes:
  prism_pg:
  prism_ollama:
