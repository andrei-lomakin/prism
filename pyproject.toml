[project]
name = "prism"
version = "0.1.0"
description = "Prism — personal research assistant: RAG + multi-agent orchestration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Andrei Lomakin" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "pgvector>=0.3.6",
  "alembic>=1.14.0",
  "arq>=0.26.1",
  "redis>=5.2.0",
  "httpx>=0.28.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "sentence-transformers>=3.0.0",
  "bm25s>=0.2.0",
  "numpy>=2.0.0",
  "pyyaml>=6.0.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "httpx>=0.28.0",
]

[project.scripts]
prism = "prism.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
