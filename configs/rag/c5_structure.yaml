# Ablation: structure-aware chunking C5
name: c5_structure
chunking:
  strategy: C5
  size: 256
  overlap: 32
embedding:
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
retrieval:
  mode: dense
  top_k: 5
rerank:
  enabled: false
rewrite:
  strategy: R0
generation:
  provider: ollama
  model: qwen3:4b
packer:
  max_chunks: 8
  max_tokens: 2048
  max_per_doc: 3
  min_score: 0.0
