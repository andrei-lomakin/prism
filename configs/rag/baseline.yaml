# Baseline RAG (Stage 2/3 reference point)
name: baseline
chunking:
  strategy: C2
  size: 256
  overlap: 32
embedding:
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
retrieval:
  mode: dense
  top_k: 5
  fusion: rrf
  alpha: 0.5
  rrf_k: 60
rerank:
  enabled: false
  model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
  candidates: 20
rewrite:
  strategy: R0
generation:
  provider: ollama
  model: qwen3:4b
packer:
  max_chunks: 8
  max_tokens: 2048
  max_per_doc: 3
  min_score: 0.0
