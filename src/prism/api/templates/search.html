{% extends "base.html" %}
{% block title %}Поиск · Prism{% endblock %}
{% block content %}
<section class="panel">
  <form id="chat-form" class="stack chat-form">
    <label class="query-label" for="query">Вопрос</label>
    <textarea id="query" rows="3" placeholder="Например: чем hybrid отличается от dense?" required></textarea>

    <div class="controls-grid">
      <div class="field">
        <div class="field-head">
          <span class="field-title">Что сделать</span>
          <button type="button" class="tip" aria-label="Подсказка: действие" data-tip>
            ?
            <span class="tip-pop" role="tooltip">
              Один выбор — одно действие по кнопке ниже:
              <ul>
                <li><b>Ответить</b> — найти фрагменты и сразу сгенерировать ответ</li>
                <li><b>Агент</b> — то же + план, инструменты, проверки</li>
                <li><b>Найти</b> — только показать найденные фрагменты, без модели</li>
              </ul>
            </span>
          </button>
        </div>
        <div class="seg seg-wrap" role="radiogroup" aria-label="Что сделать">
          <label class="seg-item">
            <input type="radio" name="mode" value="rag" checked />
            <span>Ответить</span>
          </label>
          <label class="seg-item">
            <input type="radio" name="mode" value="agent" />
            <span>Агент</span>
          </label>
          <label class="seg-item">
            <input type="radio" name="mode" value="search" />
            <span>Найти</span>
          </label>
        </div>
        <select id="mode" class="sr-only" tabindex="-1" aria-hidden="true">
          <option value="rag" selected>ответить</option>
          <option value="agent">агент</option>
          <option value="search">найти</option>
        </select>
      </div>

      <div class="field">
        <div class="field-head">
          <span class="field-title">Где искать</span>
          <button type="button" class="tip" aria-label="Подсказка: пространство" data-tip>
            ?
            <span class="tip-pop" role="tooltip">
              Какой слой документов брать:
              <ul>
                <li><b>Все</b> — без фильтра (личное чуть важнее остального)</li>
                <li><b>Личное / Проект / Общее</b> — только этот слой</li>
                <li>Демо-корпус лежит в <b>Общем</b></li>
              </ul>
              Число фрагментов задаётся в Настройках.
            </span>
          </button>
        </div>
        <div class="seg seg-wrap" role="radiogroup" aria-label="Где искать">
          <label class="seg-item">
            <input type="radio" name="space" value="all" />
            <span>Все</span>
          </label>
          <label class="seg-item">
            <input type="radio" name="space" value="personal" />
            <span>Личное</span>
          </label>
          <label class="seg-item">
            <input type="radio" name="space" value="project" />
            <span>Проект</span>
          </label>
          <label class="seg-item">
            <input type="radio" name="space" value="shared" checked />
            <span>Общее</span>
          </label>
        </div>
        <select id="space" class="sr-only" tabindex="-1" aria-hidden="true">
          <option value="all">все</option>
          <option value="personal">personal</option>
          <option value="project">project</option>
          <option value="shared" selected>shared</option>
        </select>
      </div>

    </div>

    <div class="actions">
      <p id="flow-hint" class="flow-hint muted">Общее · ответ · по шагам</p>
      <div class="actions-stream" id="stream-wrap">
        <label class="switch" for="stream">
          <input type="checkbox" id="stream" checked />
          <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
          <span class="switch-text">По шагам</span>
        </label>
        <button type="button" class="tip tip-tight" aria-label="Подсказка: показ прогресса" data-tip>
          ?
          <span class="tip-pop tip-pop-end" role="tooltip">
            Как показывать работу на экране:
            <ul>
              <li><b>По шагам</b> — видно поиск, генерацию и промежуточные этапы</li>
              <li><b>Только итог</b> — один готовый результат в конце</li>
            </ul>
            На качество ответа не влияет. В режиме «Найти» не используется.
          </span>
        </button>
      </div>
      <button type="submit" class="btn" id="btn-ask">Ответить</button>
    </div>
  </form>

  <div id="run-panel" class="run-panel hidden">
    <div id="run-status" class="run-status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span class="run-status-text">Готовимся…</span>
    </div>
    <ol id="run-steps" class="run-steps"></ol>
    <div id="answer-note" class="answer-note hidden" role="status" aria-live="polite"></div>
    <div id="answer" class="answer hidden"></div>
    <div id="trace-link" class="trace-bar hidden"></div>
  </div>
  <div id="sources" class="sources"></div>
</section>

<aside id="cite-drawer" class="cite-drawer hidden" aria-live="polite">
  <div class="cite-drawer-head">
    <strong id="cite-drawer-title">Источник</strong>
    <button type="button" class="btn btn-ghost" id="cite-drawer-close">Закрыть</button>
  </div>
  <p id="cite-drawer-meta" class="muted"></p>
  <div id="cite-drawer-body" class="cite-drawer-body"></div>
</aside>
{% endblock %}
{% block scripts %}
<script>
  const SPACE_RU = { all: 'все слои', personal: 'личное', project: 'проект', shared: 'общее' };
  const MODE_BTN = { rag: 'Ответить', agent: 'Запустить агента', search: 'Найти фрагменты' };

  function syncHidden(name, selectId) {
    const checked = document.querySelector(`input[name="${name}"]:checked`);
    const sel = document.getElementById(selectId);
    if (checked && sel) sel.value = checked.value;
  }

  function refreshHint() {
    syncHidden('mode', 'mode');
    syncHidden('space', 'space');
    const mode = document.getElementById('mode').value;
    const space = document.getElementById('space').value;
    const streamOn = document.getElementById('stream').checked;
    const streamWrap = document.getElementById('stream-wrap');
    const streamLabel = document.querySelector('.switch-text');
    const askBtn = document.getElementById('btn-ask');
    if (streamLabel) streamLabel.textContent = streamOn ? 'По шагам' : 'Только итог';
    if (streamWrap) streamWrap.classList.toggle('is-disabled', mode === 'search');
    if (askBtn) askBtn.textContent = MODE_BTN[mode] || 'Запустить';

    let action;
    if (mode === 'search') action = 'только фрагменты';
    else if (mode === 'agent') action = 'агент';
    else action = 'ответ';

    const progress = mode === 'search'
      ? null
      : (streamOn ? 'по шагам' : 'только итог');

    document.getElementById('flow-hint').textContent = progress
      ? `${SPACE_RU[space] || space} · ${action} · ${progress}`
      : `${SPACE_RU[space] || space} · ${action}`;
  }

  document.querySelectorAll('input[name="mode"], input[name="space"]').forEach((el) => {
    el.addEventListener('change', refreshHint);
  });
  document.getElementById('stream').addEventListener('change', refreshHint);
  document.querySelectorAll('[data-tip]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const open = btn.classList.contains('open');
      document.querySelectorAll('[data-tip].open').forEach((b) => b.classList.remove('open'));
      if (!open) btn.classList.add('open');
    });
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('[data-tip]')) {
      document.querySelectorAll('[data-tip].open').forEach((b) => b.classList.remove('open'));
    }
  });
  refreshHint();

  document.getElementById('chat-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    syncHidden('mode', 'mode');
    syncHidden('space', 'space');
    const mode = document.getElementById('mode').value;
    if (mode === 'search') {
      await PrismApp.searchOnly();
      return;
    }
    const stream = document.getElementById('stream')?.checked;
    if (stream) await PrismApp.chatStream();
    else await PrismApp.chat();
  });
  document.getElementById('cite-drawer-close')?.addEventListener('click', () => PrismApp.closeCitation());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') PrismApp.closeCitation();
  });
</script>
{% endblock %}
