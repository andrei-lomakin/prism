{% extends "base.html" %}
{% block title %}Поиск · Призма{% endblock %}
{% block content %}
<section class="panel">
  <form id="chat-form" class="stack chat-form">
    <textarea id="query" rows="3" placeholder="Найти фрагменты в базе…" required aria-label="Запрос"></textarea>

    <div class="field">
      <div class="field-head">
        <span class="field-title">Где искать</span>
        <button type="button" class="tip" aria-label="Подсказка: пространство" data-tip>
          ?
          <span class="tip-pop" role="tooltip">
            Какой слой документов брать. Демо-корпус — в <b>Общем</b>.
            Для ответа с генерацией откройте вкладку <b>Чат</b>.
          </span>
        </button>
      </div>
      <div class="seg seg-wrap" role="radiogroup" aria-label="Где искать">
        <label class="seg-item">
          <input type="radio" name="space" value="all" />
          <span>Все</span>
        </label>
        <label class="seg-item">
          <input type="radio" name="space" value="personal" />
          <span>Личное</span>
        </label>
        <label class="seg-item">
          <input type="radio" name="space" value="project" />
          <span>Проект</span>
        </label>
        <label class="seg-item">
          <input type="radio" name="space" value="shared" checked />
          <span>Общее</span>
        </label>
      </div>
      <select id="space" class="sr-only" tabindex="-1" aria-hidden="true">
        <option value="all">all</option>
        <option value="personal">personal</option>
        <option value="project">project</option>
        <option value="shared" selected>shared</option>
      </select>
      <select id="mode" class="sr-only" tabindex="-1" aria-hidden="true">
        <option value="search" selected>search</option>
      </select>
    </div>

    <div class="actions">
      <p class="flow-hint muted">Только фрагменты · без генерации</p>
      <button type="submit" class="btn" id="btn-ask">Найти</button>
    </div>
  </form>

  <div id="run-panel" class="run-panel hidden">
    <div id="run-status" class="run-status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span class="run-status-text">Готовимся…</span>
    </div>
    <ol id="run-steps" class="run-steps"></ol>
    <div id="answer-note" class="answer-note hidden" role="status"></div>
    <div id="answer" class="answer hidden"></div>
    <div id="trace-link" class="trace-bar hidden"></div>
  </div>
  <div id="sources" class="sources"></div>
</section>
{% endblock %}
{% block scripts %}
<script>
  function syncSpace() {
    const checked = document.querySelector('input[name="space"]:checked');
    const sel = document.getElementById('space');
    if (checked && sel) sel.value = checked.value;
  }
  document.querySelectorAll('input[name="space"]').forEach((el) => {
    el.addEventListener('change', syncSpace);
  });
  document.querySelectorAll('[data-tip]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const open = btn.classList.contains('open');
      document.querySelectorAll('[data-tip].open').forEach((b) => b.classList.remove('open'));
      if (!open) btn.classList.add('open');
    });
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('[data-tip]')) {
      document.querySelectorAll('[data-tip].open').forEach((b) => b.classList.remove('open'));
    }
  });
  syncSpace();
  document.getElementById('chat-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    syncSpace();
    await PrismApp.searchOnly();
  });
</script>
{% endblock %}
