name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff format
        run: ruff format --check src tests

      - name: Ruff lint
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

      - name: Agent scenarios (mock LLM)
        run: python -m prism.cli agent eval --scenarios data/agent_scenarios.jsonl

      - name: Eval compare (from committed reports)
        run: python -m prism.cli eval compare

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional retrieval smoke — needs indexed DB; skipped until demo fixtures in CI image.
  # Enable when compose services + ingest-demo are wired into the job.
  # retrieval-smoke:
  #   runs-on: ubuntu-latest
  #   services:
  #     postgres:
  #       image: pgvector/pgvector:pg16
  #       ...
