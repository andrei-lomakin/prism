name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff format
        run: ruff format --check src tests

      - name: Ruff lint
        run: ruff check src tests

      - name: Pytest + coverage
        run: pytest -q --cov=prism --cov-report=term-missing

      - name: Agent scenarios (mock LLM)
        run: python -m prism.cli agent eval --scenarios data/agent_scenarios.jsonl

      - name: Eval compare + kappa example
        run: |
          python -m prism.cli eval compare
          python -m prism.cli eval kappa --a data/golden/annotator_a.example.jsonl --b data/golden/annotator_b.example.jsonl

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t prism:ci .
